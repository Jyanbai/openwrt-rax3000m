name: RAX3000M 25.12.5 campus APKs

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

concurrency:
  group: rax3000m-25.12.5-campus-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate standalone APK bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout this fork
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libfuse-dev libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            qemu-utils ccache cmake ninja-build jq kmod dnsmasq-base dnsutils shellcheck
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      - name: Build and validate campus APK bundle
        env:
          OPENWRT_ROOT: /workdir/openwrt
        run: bash sh/campus-apk-build.sh

      - name: Show final disk usage
        if: always()
        run: df -hT

      - name: Upload validated APK bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-25.12.5-campus-apk
          path: out/
          if-no-files-found: error
          retention-days: 14
