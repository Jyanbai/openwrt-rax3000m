name: RAX3000M 25.12.5 campus APKs

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

concurrency:
  group: rax3000m-25.12.5-campus-apk
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate standalone APK bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout this fork
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libfuse-dev libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            qemu-utils ccache cmake ninja-build jq kmod dnsmasq-base dnsutils shellcheck
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      - name: Build and validate campus APK bundle
        env:
          OPENWRT_ROOT: /workdir/openwrt
        run: bash sh/campus-apk-build.sh

      - name: Show final disk usage
        if: always()
        run: df -hT

      - name: Upload validated APK bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-25.12.5-campus-apk
          path: out/
          if-no-files-found: error
          retention-days: 14

  full_image:
    name: Build and inspect full RAX3000M image
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout this fork
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libfuse-dev libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            qemu-utils ccache cmake ninja-build jq kmod
          sudo mkdir -p /workdir/openwrt-dl
          sudo chown -R "$USER":"$(id -gn)" /workdir

      - name: Restore OpenWrt download cache
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt-dl
          key: openwrt-dl-ubuntu-24.04-0e38877debc3b65b11b4b0589268d29c6b19404f-5caa62e0bc9f7fb9b0c12a23267bceb7724214dd-mediatek-filogic-${{ hashFiles('config/config-apk', 'sh/op.sh', 'patch/**', 'package/portal-dns-guard/**') }}
          restore-keys: |
            openwrt-dl-ubuntu-24.04-0e38877debc3b65b11b4b0589268d29c6b19404f-5caa62e0bc9f7fb9b0c12a23267bceb7724214dd-mediatek-filogic-

      - name: Build and inspect full RAX3000M image
        env:
          OPENWRT_ROOT: /workdir/openwrt
          OPENWRT_DL_CACHE: /workdir/openwrt-dl
        run: bash sh/campus-image-build.sh

      - name: Show final disk usage
        if: always()
        run: df -hT

      - name: Upload full image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-25.12.5-full-image
          path: full-image-out/
          if-no-files-found: error
          retention-days: 14
